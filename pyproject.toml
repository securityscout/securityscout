[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "securityscout"
version = "0.1.0"
description = "Security Scout — LLM-assisted SAST triage kernel"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "Baboucarr Ceesay" }]

dependencies = [
  "jsonschema>=4.20",
  "python-dotenv>=1.0",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.44",
  "anthropic>=1.4.0",
  "openai>=3.8.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "httpx>=0.28",
]

[tool.setuptools.packages.find]
include = ["triage*", "api*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
